     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

            <body>
                <h1> "My Interactive Dashboard"</h1>
                    <p>"This dashboard was created by Colin Crowe for the WEB-115 course at Wake Tech"</p>
                    <link rel="stylesheet" href="css/style.css">
                <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")</script>
                
                <noscript>"Unfortunately, your web browser does not support JavaScript."</noscript>
                <div class="container">
                    <div class="row">
                        <div class="col" id="metric-converter">
                            <form>
                                Enter numeric value:<input type="number" id ="numbervalue">
                                Select Option:<select id="Measurments" name="Measurments">
                                    <option value="in>cm">inches to centimeters</option>
                                    <option value="ft>cm">feet to centimeters</option>
                                    <option value="yd>m">yards to meters</option>
                                    <option value="mi>km">miles to kilometers</option>

                                    <option value="cm>in">centimeters to inches</option>
                                    <option value="cm>ft">centimeters to feet</option>
                                    <option value="m>yd">meters to yards</option>
                                    <option value="km>mi">kilometers to miles</option>
                                </select>
                                <button id="startconversion">start conversion</button>
                                        
                                
                            </form>
                            <script>
                                document.getElementById("startconversion").addEventListener("click", function(event){
                                event.preventDefault();
                                });
                            </script>
                            <p id="conversion-message">
                                
                            </p>
                            <script src="metric-converter.js"></script>
                        <div class="col" id="weekly-tasks">
                            
                            <form> 
                            Enter name: <input type="text"id="name"> <br>
                            Enter daily target: <input type="number" id="dailytarget"> <br>
                            Enter weekly bonus tasks: <input type="number" id="bonus"> <br>
                            <button id="goal-btn">submit</button>
                            </form>
                            <script>
                                document.getElementById("goal-btn").addEventListener("click", function(event){
                                event.preventDefault();
                                });
                            </script>
                            <p id="goal-message"> 
                                
                            </p>

                            
                            <script  src="task-manager.js" defer></script>
                        </div>
                        <!-- Dashboard Content -->
                    </div>
                </div>
                
            </body>

        
   
</html>
